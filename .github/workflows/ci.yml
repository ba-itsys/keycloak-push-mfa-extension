name: CI

on:
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check format and run tests
        run: mvn -B spotless:check verify

  # Note: The name `automerge-check` is configured in the ruleset (repo settings) as a required merge check
  automerge-check:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ needs.build.result }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed"
              exit 1
            fi
          done
          echo "All jobs succeeded"
